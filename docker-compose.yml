services:
  db:
    image: postgres:17-alpine3.21
    container_name: tama-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    networks:
      - app_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d postgres',
        ]
      interval: 5s
      timeout: 2s
      retries: 20

  tama-web:
    container_name: tama-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the bundle at build time, so every
        # one of them must be passed here as well as set at runtime below.
        NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT:?set in Dokploy environment}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set in Dokploy environment}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set in Dokploy environment}
        NEXT_PUBLIC_SUPABASE_STORAGE_NAME: ${NEXT_PUBLIC_SUPABASE_STORAGE_NAME:?set in Dokploy environment}
        NEXT_PUBLIC_FACEBOOK_ACCESS_TOKEN: ${NEXT_PUBLIC_FACEBOOK_ACCESS_TOKEN:?set in Dokploy environment}

    image: tama-web
    restart: unless-stopped

    networks:
      - dokploy-network

    environment:
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_SECRET: ${AUTH_SECRET:?set in Dokploy environment}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set in Dokploy environment}
      AUTH_URL: ${AUTH_URL:?set in Dokploy environment}
      NEXT_PUBLIC_API_ENDPOINT: ${NEXT_PUBLIC_API_ENDPOINT}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SUPABASE_STORAGE_NAME: ${NEXT_PUBLIC_SUPABASE_STORAGE_NAME}
      NEXT_PUBLIC_FACEBOOK_ACCESS_TOKEN: ${NEXT_PUBLIC_FACEBOOK_ACCESS_TOKEN}
    depends_on:
      db:
        condition: service_healthy

    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # =========================
      # WEB ROUTER PRIORITY (HIGHEST)
      # =========================
      - traefik.http.routers.tama-web.priority=1000
      - traefik.http.routers.tama-websecure.priority=1000

      # =========================
      # HTTP (redirect only)
      # =========================
      # Dokploy's Domains UI adds extra services to this container, so every
      # router MUST name its service explicitly — Traefik drops routers it
      # cannot link automatically when more than one service is defined.
      - traefik.http.routers.tama-web.rule=Host(`tamalawi.com`) || Host(`www.tamalawi.com`) || Host(`tamalawi.infi-tech.cloud`) || Host(`www.tamalawi.infi-tech.cloud`)
      - traefik.http.routers.tama-web.entrypoints=web
      - traefik.http.routers.tama-web.service=tama-web
      - traefik.http.routers.tama-web.middlewares=redirect-to-https@file

      # =========================
      # HTTPS (main web entry)
      # =========================
      - traefik.http.routers.tama-websecure.rule=Host(`tamalawi.com`) || Host(`www.tamalawi.com`) || Host(`tamalawi.infi-tech.cloud`) || Host(`www.tamalawi.infi-tech.cloud`)
      - traefik.http.routers.tama-websecure.entrypoints=websecure
      - traefik.http.routers.tama-websecure.service=tama-web
      - traefik.http.routers.tama-websecure.tls.certresolver=letsencrypt

      # =========================
      # SERVICE
      # =========================
      - traefik.http.services.tama-web.loadbalancer.server.port=3019


  tama-api:
    container_name: tama-api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile

    image: tama-api
    restart: unless-stopped

    networks:
      - dokploy-network
      - app_network

    environment:
      DATABASE_URL: ${DATABASE_URL:?set in Dokploy environment}
      JWT_ACCESS_SECRET_KEY: ${JWT_ACCESS_SECRET_KEY:?set in Dokploy environment}
      JWT_REFRESH_SECRET_KEY: ${JWT_REFRESH_SECRET_KEY:?set in Dokploy environment}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      AUTH_SECRET: ${AUTH_SECRET:?set in Dokploy environment}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set in Dokploy environment}
      AUTH_URL: ${AUTH_URL:?set in Dokploy environment}
      CLIENT_BASE_URL: ${CLIENT_BASE_URL:?set in Dokploy environment}
      DOMAIN_NAME: ${DOMAIN_NAME}
      EMAIL_HOST: ${EMAIL_HOST}
      DOMAIN_EMAIL: ${DOMAIN_EMAIL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_PHONE_NUMBER: ${ADMIN_PHONE_NUMBER}
    depends_on:
      db:
        condition: service_healthy

    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # =========================
      # API ROUTER PRIORITY
      # =========================
      - traefik.http.routers.tama-api.priority=1000
      - traefik.http.routers.tama-apisecure.priority=1000

      # =========================
      # HTTP (redirect)
      # =========================
      # As above: the service must be named explicitly on every router.
      - traefik.http.routers.tama-api.rule=Host(`api.tamalawi.com`) || Host(`api.tamalawi.infi-tech.cloud`)
      - traefik.http.routers.tama-api.entrypoints=web
      - traefik.http.routers.tama-api.service=tama-api
      - traefik.http.routers.tama-api.middlewares=redirect-to-https@file

      # =========================
      # HTTPS API
      # =========================
      - traefik.http.routers.tama-apisecure.rule=Host(`api.tamalawi.com`) || Host(`api.tamalawi.infi-tech.cloud`)
      - traefik.http.routers.tama-apisecure.entrypoints=websecure
      - traefik.http.routers.tama-apisecure.service=tama-api
      - traefik.http.routers.tama-apisecure.tls.certresolver=letsencrypt

      # =========================
      # SERVICE
      # =========================
      - traefik.http.services.tama-api.loadbalancer.server.port=8003


networks:
  dokploy-network:
    external: true
  app_network:
    driver: bridge
