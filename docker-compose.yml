services:
  db:
    image: postgres:17-alpine3.21
    container_name: tama-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tama
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - '5433:5432'
    networks:
      - app_network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d postgres',
        ]
      interval: 5s
      timeout: 2s
      retries: 20

  tama-web:
    container_name: tama-web
    build:
      context: .
      dockerfile: ./apps/web/Dockerfile
      args:
        # NEXT_PUBLIC_* are inlined into the bundle at build time,
        # so they must be passed here as well as in .env.prod at runtime.
        NEXT_PUBLIC_API_ENDPOINT: https://api.tamalawi.infi-tech.cloud
        NEXT_PUBLIC_SUPABASE_URL: https://tmeaxzldethzzemzsosu.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtZWF4emxkZXRoenplbXpzb3N1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg4NzQ0NjMsImV4cCI6MjA2NDQ1MDQ2M30.OXlJisOW83inoVF5JDuKJ_jJKLVH8pUFk-pHrrtlaHU
        NEXT_PUBLIC_SUPABASE_STORAGE_NAME: tama
        NEXT_PUBLIC_FACEBOOK_ACCESS_TOKEN: EAA4JYYQBut0BO3mz7vuz9ZBjomLLUUBxCLUwppE6fQxKnfjeGE3im5eGzxpFULM01ZBeRGUqYBDjV7PA5W8h30cYFChdEwP59em94BVMCfGZCPKiJwWvZA6kZCG7oPvTkdQPZCU2WXdO3YsY16JHP7JCoksZBcg6wAiW8zMUXmUZBkseIOiUZAz9LNtZAVII2kcECQ

    image: tama-web
    restart: unless-stopped

    networks:
      - dokploy-network

    env_file:
      - ./apps/web/.env.prod
    depends_on:
      db:
        condition: service_healthy

    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # =========================
      # WEB ROUTER PRIORITY (HIGHEST)
      # =========================
      - traefik.http.routers.tama-web.priority=1000
      - traefik.http.routers.tama-websecure.priority=1000

      # =========================
      # HTTP (redirect only)
      # =========================
      - traefik.http.routers.tama-web.rule=Host(`tamalawi.com`) || Host(`www.tamalawi.com`)
      - traefik.http.routers.tama-web.entrypoints=web
      - traefik.http.routers.tama-web.middlewares=redirect-to-https@file

      # =========================
      # HTTPS (main web entry)
      # =========================
      - traefik.http.routers.tama-websecure.rule=Host(`tamalawi.com`) || Host(`www.tamalawi.com`)
      - traefik.http.routers.tama-websecure.entrypoints=websecure
      - traefik.http.routers.tama-websecure.tls.certresolver=letsencrypt

      # =========================
      # SERVICE
      # =========================
      - traefik.http.services.tama-web.loadbalancer.server.port=3019


  tama-api:
    container_name: tama-api
    build:
      context: .
      dockerfile: ./apps/api/Dockerfile

    image: tama-api
    restart: unless-stopped

    networks:
      - dokploy-network

    env_file:
      - ./apps/api/.env.prod
    depends_on:
      db:
        condition: service_healthy

    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network

      # =========================
      # API ROUTER PRIORITY
      # =========================
      - traefik.http.routers.tama-api.priority=1000
      - traefik.http.routers.tama-apisecure.priority=1000

      # =========================
      # HTTP (redirect)
      # =========================
      - traefik.http.routers.tama-api.rule=Host(`api.tamalawi.com`)
      - traefik.http.routers.tama-api.entrypoints=web
      - traefik.http.routers.tama-api.middlewares=redirect-to-https@file

      # =========================
      # HTTPS API
      # =========================
      - traefik.http.routers.tama-apisecure.rule=Host(`api.tamalawi.com`)
      - traefik.http.routers.tama-apisecure.entrypoints=websecure
      - traefik.http.routers.tama-apisecure.tls.certresolver=letsencrypt

      # =========================
      # SERVICE
      # =========================
      - traefik.http.services.tama-api.loadbalancer.server.port=8003


networks:
  dokploy-network:
    external: true
  app_network:
    driver: bridge
